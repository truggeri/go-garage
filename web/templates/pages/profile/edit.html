{{define "title"}}Edit Profile - Go-Garage{{end}}

{{define "content"}}
<div class="page-header">
    <h1>Edit Profile</h1>
    <a href="/profile" class="btn btn-secondary">Cancel</a>
</div>

<div class="card">
    <form hx-put="/api/v1/users/me" hx-ext="json-enc" hx-swap="none" hx-validate="true">
        <div data-form-errors role="alert" aria-live="assertive"></div>
        <div class="form-section">
            <h2 class="form-section-title">Account Information</h2>

            <div class="form-group">
                <label class="form-label" for="username">Username <span class="required" aria-hidden="true">*</span></label>
                <input class="form-input"
                       type="text" id="username" name="username"
                       value="{{.Username}}"
                       required minlength="3" maxlength="30"
                       placeholder="e.g. johndoe"
                       aria-describedby="username-error">
                <p class="form-error" id="username-error" data-field="username"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email <span class="required" aria-hidden="true">*</span></label>
                <input class="form-input"
                       type="email" id="email" name="email"
                       value="{{.Email}}"
                       required
                       placeholder="e.g. john@example.com"
                       aria-describedby="email-error">
                <p class="form-error" id="email-error" data-field="email"></p>
            </div>
        </div>

        <div class="form-section">
            <h2 class="form-section-title">Personal Information</h2>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="first_name">First Name</label>
                    <input class="form-input"
                           type="text" id="first_name" name="first_name"
                           value="{{.FirstName}}"
                           placeholder="e.g. John"
                           aria-describedby="first-name-error">
                    <p class="form-error" id="first-name-error" data-field="first_name"></p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="last_name">Last Name</label>
                    <input class="form-input"
                           type="text" id="last_name" name="last_name"
                           value="{{.LastName}}"
                           placeholder="e.g. Doe"
                           aria-describedby="last-name-error">
                    <p class="form-error" id="last-name-error" data-field="last_name"></p>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/profile" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{{end}}
