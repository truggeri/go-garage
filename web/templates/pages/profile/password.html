{{define "title"}}Change Password - Go-Garage{{end}}

{{define "content"}}
<div class="page-header">
    <h1>Change Password</h1>
    <a href="/profile" class="btn btn-secondary">Cancel</a>
</div>

<div class="card">
    <form method="POST" hx-put="/api/v1/users/me/password" hx-ext="json-enc" hx-swap="none" hx-validate="true">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <div data-form-errors role="alert" aria-live="assertive"></div>
        <div class="form-section">
            <h2 class="form-section-title">Update Your Password</h2>

            <div class="form-group">
                <label class="form-label" for="current_password">Current Password <span class="required" aria-hidden="true">*</span></label>
                <input class="form-input"
                       type="password" id="current_password" name="current_password"
                       required autocomplete="current-password"
                       aria-describedby="current_password-error">
                <p class="form-error" id="current_password-error" data-field="current_password"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="new_password">New Password <span class="required" aria-hidden="true">*</span></label>
                <input class="form-input"
                       type="password" id="new_password" name="new_password"
                       required minlength="8"
                       data-validate-password="true"
                       autocomplete="new-password" aria-describedby="new_password-help new_password-error">
                <p class="form-hint" id="new_password-help">Must be at least 8 characters with one uppercase letter, one lowercase letter, and one digit.</p>
                <p class="form-error" id="new_password-error" data-field="new_password"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">Confirm New Password <span class="required" aria-hidden="true">*</span></label>
                <input class="form-input"
                       type="password" id="confirm_password" name="confirm_password"
                       required minlength="8"
                       data-match-field="new_password"
                       autocomplete="new-password" aria-describedby="confirm_password-error">
                <p class="form-error" id="confirm_password-error" data-field="confirm_password"></p>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Change Password</button>
            <a href="/profile" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{{end}}
