version: "2"

linters:
  disable:
    - errcheck
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unparam
    - unconvert
    - goconst
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    goconst:
      min-occurrences: 10
  exclusions:
    generated: lax
    paths:
      - vendor
      - bin
      - ".*_test\\.go"
      - "cmd/seed/.*"
      - "internal/database/seeddata/.*"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
