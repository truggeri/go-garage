name: Release SBOM and Provenance

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attest-release:
    name: Build and Attest Release
    if: github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build release binary
        run: |
          mkdir -p bin
          go build -trimpath -o bin/go-garage ./cmd/server

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: go-garage.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: bin/go-garage
