name: Release SBOM and Provenance

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attest-release:
    name: Build and Attest Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release tag is on main
        id: main_release
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "is_on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release tag is not reachable from main; skipping attestation."
            echo "is_on_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.main_release.outputs.is_on_main == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Build release binary
        if: steps.main_release.outputs.is_on_main == 'true'
        run: |
          mkdir -p bin
          go build -trimpath -o bin/go-garage ./cmd/server

      - name: Generate SPDX SBOM
        if: steps.main_release.outputs.is_on_main == 'true'
        uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: go-garage.spdx.json
          upload-artifact: true
          upload-release-assets: true

      - name: Attest build provenance
        if: steps.main_release.outputs.is_on_main == 'true'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: bin/go-garage
